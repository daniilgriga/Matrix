name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  ubuntu-debug:
    name: Ubuntu (GCC Debug)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev

      - name: Configure
        run: cmake -S . -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build/debug

      - name: Run Tests
        run: ctest --test-dir build/debug --output-on-failure

  ubuntu-sanitize:
    name: Ubuntu (GCC + Sanitizers)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev

      - name: Configure with sanitizers
        run: cmake -S . -B build/sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DSANITIZE=ON

      - name: Build
        run: cmake --build build/sanitize

      - name: Run Tests
        run: ctest --test-dir build/sanitize --output-on-failure

  ubuntu-release:
    name: Ubuntu (GCC Release)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Release build
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DSANITIZE=OFF -DBUILD_TESTS=OFF
          cmake --build build/release
